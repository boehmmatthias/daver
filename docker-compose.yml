services:
  db:
    image: mysql:8.4
    container_name: daver_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pizzatime}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-daver_db}
      MYSQL_USER: ${MYSQL_USER:-daver}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pizzatime}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
  web:
    build:
        context: ./daver-ui
        dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: daver-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # point at the internal Docker service by default:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      # persist uploaded config & analysis between restarts
      - ./daver-api/uploads:/app/uploads
      - ./daver-api/analysis:/app/analysis
    depends_on:
      # if you also spin up a database
      - db
  ollama:
    build:
      context: ./daver-ollama
      dockerfile: Dockerfile
    profiles:
      - local-ollama
    container_name: daver_ollama
    restart: unless-stopped
    # Expose default Ollama REST API port
    ports:
      - "11434:11434"
    # Persist downloaded models & metadata here
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
    name: daver_db_data
  ollama_data:
    name: daver_ollama_data
