    context: Unique identifier for an event.
    type: int
    nullable: 'YES'
    key: MUL
    default: null
    extra: ''
  - name: competitor_id
    context: Unique identifier for a competitor.
    type: int
    nullable: 'YES'
    key: MUL
    default: null
    extra: ''
  - name: medal_id
    context: Identifier for the medal awarded to the competitor in the event.
    type: int
    nullable: 'YES'
    key: MUL
    default: null
    extra: ''
